<style>
/* Layout: a field atlas index. Header, then sections of equal tiles; each tile is a small original drawing of its topic. */
:root {
  --ink: #060912; --panel: rgba(12, 17, 32, 0.78); --text: #f1f4fb; --muted: #a3aec4; --line: rgba(200, 215, 245, 0.14);
  --geo: #2ee6c5; --land: #b8f03a; --water: #4d8dff; --people: #ffb547; --earth: #ff5c9a;
  --font-display: "Bricolage Grotesque", "Tajawal", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Tajawal", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 700px at 85% -10%, rgba(46,230,197,.14), transparent 60%), radial-gradient(900px 600px at -10% 30%, rgba(77,141,255,.12), transparent 60%), var(--ink); background-attachment: fixed; color: var(--text); font-family: var(--font-body); font-size: 16px; }
.page { max-width: 1180px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 30px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--people); outline-offset: 3px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.back:hover { border-color: var(--text); }
.lang { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { background: none; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 700; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 7vw, 72px); line-height: .95; letter-spacing: -0.03em; margin: 0; }
.hero h1 span { color: var(--geo); }
.hero p { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 12px 0 0; max-width: 60ch; }
.section { display: grid; gap: 14px; }
.section h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
.section h2 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.tile { --c: var(--geo); position: relative; display: grid; grid-template-rows: auto 1fr; gap: 10px; text-decoration: none; text-align: start; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 14%, transparent), transparent 60%), var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px; overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s; min-height: 200px; }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 16px 40px -20px var(--c); }
.tile svg { width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px; background: color-mix(in srgb, var(--c) 10%, #0b1222); display: block; }
.tile b { font-family: var(--font-display); font-size: 19px; line-height: 1.15; }
.tile span { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: block; margin-top: 4px; }
.tile .count { position: absolute; top: 20px; inset-inline-start: 20px; background: rgba(6,9,18,.75); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.tile.soon { cursor: default; }
.tile.soon svg { filter: saturate(.55) brightness(.8); }
.tile .soonpill { position: absolute; top: 20px; inset-inline-end: 20px; border: 1px dashed var(--c); color: var(--c); border-radius: 999px; padding: 2px 8px; font-size: 12px; background: rgba(6,9,18,.75); }
.tile.shake { animation: shake .4s; }
@keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
html[lang="ar"] * { letter-spacing: 0 !important; }
html[lang="ar"] .hero h1 { line-height: 1.2; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 460px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .tile { min-height: 0; padding: 10px; } .tile b { font-size: 16px; } .tile span { display: none; } }
</style>
</head>
