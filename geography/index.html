<style>
/* Layout: mission-control for the planet. A live satellite Earth fills the hero beside the title and counters;
   below, filter chips and a wall of animated topic cards, each a small living scene of its subject. */
:root {
  --ink: #050811; --panel: rgba(13, 19, 36, 0.72); --panel-2: rgba(20, 28, 52, 0.85); --text: #f2f5fc; --muted: #a6b2c9; --line: rgba(200, 215, 245, 0.13);
  --world: #2ee6c5; --land: #ffb547; --water: #4da3ff; --people: #ff6fae; --earth: #b18cff;
  --font-display: "Bricolage Grotesque", "Tajawal", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Tajawal", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: 16px; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.page { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 64px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--land); outline-offset: 3px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pillbtn { text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; backdrop-filter: blur(10px); transition: border-color .2s, background .2s; }
@media (hover: hover) { .pillbtn:hover { border-color: var(--text); background: var(--panel-2); } }
.lang { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(10px); }
.lang button { background: none; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 700; }
@media (pointer: coarse) { .lang button { min-height: 38px; padding: 8px 12px; } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 24px; min-height: 460px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--world); font-weight: 700; }
.kicker i { width: 8px; height: 8px; border-radius: 50%; background: var(--world); box-shadow: 0 0 12px var(--world); animation: blip 2s ease-in-out infinite; }
@keyframes blip { 50% { opacity: .35; transform: scale(.7); } }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(46px, 7.6vw, 96px); line-height: .92; letter-spacing: -0.04em; margin: 14px 0 0; text-wrap: balance; }
.hero h1 .glow { padding: 0 .12em .1em 0; margin-inline-end: -.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: linear-gradient(100deg, var(--world), var(--water) 30%, var(--earth) 55%, var(--people) 75%, var(--land)); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 9s linear infinite; }
@keyframes shimmer { to { background-position: -220% 0; } }
.hero p { color: var(--muted); font-size: 18px; line-height: 1.55; margin: 16px 0 0; max-width: 50ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 26px; max-width: 560px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(10px); }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 6px; color: var(--muted); font-size: 12.5px; }
.stat:nth-child(1) b { color: var(--world); } .stat:nth-child(2) b { color: var(--land); } .stat:nth-child(3) b { color: var(--water); } .stat:nth-child(4) b { color: var(--people); }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.cta { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 14px; padding: 14px 20px; font-weight: 700; font-size: 16px; text-decoration: none; position: relative; overflow: hidden; }
.cta.main { background: linear-gradient(135deg, var(--world), #19b8d6); color: #04141a; box-shadow: 0 10px 30px -10px var(--world); }
.cta.main::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-120%); animation: sweep 3.6s ease-in-out infinite; }
@keyframes sweep { 60%, 100% { transform: translateX(120%); } }
.cta.alt { background: var(--panel); border: 1px solid var(--line); color: var(--text); }
@media (hover: hover) { .cta.alt:hover { border-color: var(--land); } }
.cta svg { width: 18px; height: 18px; }
.globe-wrap { position: relative; aspect-ratio: 1; width: min(100%, 520px); justify-self: center; }
.globe-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.globe-wrap #bigGlobeGL { pointer-events: none; }
.globe-wrap .ring { position: absolute; inset: 4%; border-radius: 50%; border: 1px dashed rgba(46,230,197,.25); animation: spin 60s linear infinite; pointer-events: none; }
.globe-wrap .ring.r2 { inset: -2%; border-color: rgba(177,140,255,.18); animation-duration: 90s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

/* filters */
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; padding: 8px; border-radius: 22px; background: rgba(16, 24, 48, 0.45); border: 1px solid rgba(200, 215, 245, 0.12); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 12px 40px -18px rgba(0,0,0,.6); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.chip { --c: var(--text); display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; backdrop-filter: blur(10px); transition: background .2s, border-color .2s, color .2s; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 22%, var(--panel-2)); border-color: var(--c); }
@media (hover: hover) { .chip:hover { border-color: var(--c); } }
.surprise { margin-inline-start: auto; }

/* sections and cards */
.section { display: grid; gap: 14px; }
.section-head { display: flex; align-items: baseline; gap: 12px; }
.section-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: -0.02em; }
.section-head h2 span { color: var(--c); }
.section-head em { font-style: normal; color: var(--muted); font-size: 14px; }
.section-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, transparent), transparent); align-self: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { --c: var(--world); --rx: 0deg; --ry: 0deg; position: relative; display: grid; grid-template-rows: auto 1fr; text-decoration: none; text-align: start; border: 0; padding: 0; border-radius: 22px; background: var(--panel); transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s ease, box-shadow .3s; isolation: isolate; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 45ms); }
@keyframes rise { from { transform: perspective(900px) translateY(18px) scale(.98); } }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 55%, transparent), var(--line) 40%, var(--line) 70%, color-mix(in srgb, var(--c) 35%, transparent)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 2; }
.card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; background: conic-gradient(from var(--a, 0deg), transparent 0 70%, var(--c) 80%, transparent 90%); opacity: 0; transition: opacity .3s; z-index: -1; filter: blur(6px); animation: orbit 3s linear infinite; }
@property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes orbit { to { --a: 360deg; } }
@media (hover: hover) { .card:hover, .card:focus-visible { box-shadow: 0 24px 60px -26px var(--c); } }
@media (hover: hover) { .card:hover::after, .card:focus-visible::after { opacity: .9; } }
.art { position: relative; margin: 10px 10px 0; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; background: #0b1325; }
.art svg { width: 100%; height: 100%; display: block; transition: opacity .6s; }
.art canvas.live { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .7s; }
.art.is-live canvas.live { opacity: 1; }
.art.is-live svg { opacity: 0; }
.art[data-live] { background: radial-gradient(1px 1px at 12% 20%, #fff8, transparent), radial-gradient(1px 1px at 72% 14%, #fff7, transparent), radial-gradient(1px 1px at 88% 70%, #fff6, transparent), radial-gradient(1px 1px at 30% 84%, #fff6, transparent), radial-gradient(1.2px 1.2px at 52% 46%, #fff5, transparent), radial-gradient(circle at 50% 120%, #14254a, #070c1a 70%); }
.art .shine { position: absolute; inset: 0; background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.22), transparent 45%); opacity: 0; transition: opacity .3s; pointer-events: none; }
@media (hover: hover) { .card:hover .art .shine { opacity: 1; } }
.body { padding: 12px 16px 14px; display: grid; gap: 4px; align-content: start; }
.body b { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.01em; line-height: 1.15; }
.body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 12px; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); white-space: nowrap; }
.badge.best { background: rgba(255, 213, 79, .16); color: #ffd54f; border-color: rgba(255, 213, 79, .45); }
.play { position: absolute; top: 20px; inset-inline-end: 20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #061018; box-shadow: 0 6px 20px -6px var(--c); transform: scale(.85); opacity: 0; transition: transform .25s, opacity .25s; z-index: 3; }
.play svg { width: 16px; height: 16px; }
@media (hover: hover) { .card:hover .play, .card:focus-visible .play { transform: scale(1); opacity: 1; } }
.card.soon { cursor: default; }
.card.soon .art svg { filter: saturate(.75); }
.ribbon { position: absolute; top: 18px; inset-inline-start: 18px; z-index: 3; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(5,8,17,.8); border: 1px dashed var(--c); color: var(--c); }
.card.shake { animation: shake .4s; }
@keyframes shake { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
.paused * { animation-play-state: paused !important; }

/* shared scene animations */
.s-wave { animation: wave 5s linear infinite; }
.s-wave.slow { animation-duration: 9s; }
@keyframes wave { to { transform: translateX(-80px); } }
.s-bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.s-sway { animation: sway 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sway { 50% { transform: rotate(5deg); } }
.s-drift { animation: drift 16s linear infinite; }
.s-drift.d2 { animation-duration: 24s; animation-delay: -9s; }
@keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(360px); } }
.s-flow { stroke-dasharray: 10 14; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.s-march { stroke-dasharray: 6 5; animation: march 1.2s linear infinite; }
@keyframes march { to { stroke-dashoffset: -22; } }
.s-pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }
.s-twinkle { animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .15; } }
.s-spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
.s-rise { animation: risesmoke 3.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes risesmoke { 0% { transform: translateY(10px) scale(.6); opacity: 0; } 25% { opacity: .9; } 100% { transform: translateY(-46px) scale(1.6); opacity: 0; } }
.s-flag { animation: flag 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 50%; }
@keyframes flag { 50% { transform: skewY(-6deg) scaleX(.94); } }
.s-pop { animation: pop 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.12); } }
.s-glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; } }
.s-rain { animation: rain .9s linear infinite; }
@keyframes rain { from { transform: translateY(-10px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(26px); opacity: 0; } }
.s-sail { animation: sail 14s ease-in-out infinite; }
@keyframes sail { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(120px); } }
.s-walk { animation: walk 18s linear infinite; }
@keyframes walk { from { transform: translateX(-60px); } to { transform: translateX(340px); } }
.s-fly { animation: fly 9s linear infinite; }
@keyframes fly { from { transform: translate(-40px, 20px); } to { transform: translate(360px, -30px); } }
.s-meridian { animation: meridian 6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes meridian { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.04); } }
.s-blink { animation: blink 4s steps(1) infinite; }
@keyframes blink { 0%, 40% { opacity: 1; } 41%, 60% { opacity: .2; } 61% { opacity: 1; } }
.s-merc { animation: merc 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes merc { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
.s-ripple { animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ripple { from { transform: scale(.2); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
.s-slide { animation: slidebands 8s ease-in-out infinite; }
@keyframes slidebands { 50% { transform: translateX(-14px); } }
.s-heat { animation: heat 2s ease-in-out infinite; }
@keyframes heat { 50% { transform: translateY(-3px); opacity: .4; } }
.s-lava { animation: lava 1.6s ease-in infinite; transform-box: fill-box; }
@keyframes lava { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--lx, 18px), 30px); opacity: 0; } }

html[lang="ar"] * { letter-spacing: 0 !important; text-transform: none !important; }
html[lang="ar"] .hero h1 { line-height: 1.15; }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .globe-wrap { width: min(86%, 420px); order: -1; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .body { padding: 10px 12px 12px; } .body b { font-size: 16px; } .body p { display: none; }
  .meta .count { display: none; } .surprise { margin-inline-start: 0; }
  .hero p { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
