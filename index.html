<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Science games for curious kids and adults: geography, chemistry, physics, math and biology, in English, Arabic and French.">
<title>MindQuest Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Tajawal:wght@400;700;800&display=swap">
<style>
/* Layout: a living "network of knowledge" canvas fills the back; header, hero with a fact card, then a category grid where the playable science is the large tile. */
:root {
  --ink: #060912;
  --panel: rgba(12, 17, 32, 0.72);
  --panel-solid: #0d1324;
  --text: #f1f4fb;
  --muted: #a3aec4;
  --line: rgba(200, 215, 245, 0.14);
  --geo: #2ee6c5;
  --chem: #b8f03a;
  --phys: #4d8dff;
  --math: #ffb547;
  --bio: #ff5c9a;
  --font-display: "Bricolage Grotesque", "Tajawal", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Tajawal", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: 16px; }
[hidden] { display: none !important; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: grid; gap: 36px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--math); outline-offset: 3px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; text-decoration: none; }
.logo svg { width: 34px; height: 34px; }
.lang { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(10px); }
.lang button { background: none; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 700; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: end; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 7vw, 84px); line-height: 0.95; letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
.hero h1 .spark { padding: 0 .12em .1em 0; margin-inline-end: -.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: linear-gradient(90deg, var(--geo), var(--chem) 30%, var(--math) 55%, var(--bio) 80%, var(--phys)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 8s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.hero p { margin: 16px 0 0; color: var(--muted); font-size: 18px; line-height: 1.5; max-width: 52ch; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; backdrop-filter: blur(12px); display: grid; gap: 10px; min-height: 150px; align-content: start; }
.fact .label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.fact .label b { display: inline-flex; align-items: center; gap: 8px; color: var(--text); }
.fact .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--fact-c, var(--geo)); box-shadow: 0 0 12px var(--fact-c, var(--geo)); }
.fact .text { font-family: var(--font-display); font-weight: 500; font-size: 21px; line-height: 1.3; transition: opacity .4s; }
.fact .text.fade { opacity: 0; }
.fact .cat { font-size: 13px; color: var(--fact-c, var(--geo)); font-weight: 700; }
.fact .nextfact { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); letter-spacing: 0; text-transform: none; }
.fact .nextfact:hover { color: var(--text); border-color: var(--text); }

/* categories */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: -16px; }
.section-title h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; margin: 0; }
.section-title span { color: var(--muted); font-size: 14px; }
.grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.cat-card { --c: var(--geo); position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; text-decoration: none; text-align: start; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, transparent), transparent 55%), var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; backdrop-filter: blur(12px); overflow: hidden; transition: transform .25s ease, border-color .25s, box-shadow .25s; min-height: 330px; flex: 0 0 calc((100% - 64px) / 5); min-width: 0; box-sizing: border-box; }
.cat-card::after { content: ""; position: absolute; inset: auto -30% -60% auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%); pointer-events: none; transition: transform .4s; }
.cat-card:hover, .cat-card:focus-visible { transform: translateY(-4px); border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 18px 50px -20px var(--c); }
.cat-card:hover::after { transform: scale(1.25); }
.cat-card .art { width: 112px; height: 112px; max-width: 100%; display: block; }
.cat-card h3 { font-family: var(--font-display); font-weight: 800; font-size: 27px; line-height: 1.05; margin: 0; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.cat-card p { margin: 8px 0 0; color: var(--muted); line-height: 1.45; max-width: 40ch; }
.cat-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.pill.play { background: var(--c); color: #071016; }
.pill.play svg { width: 14px; height: 14px; }
.pill.soon { border: 1px dashed color-mix(in srgb, var(--c) 60%, transparent); color: var(--c); }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-card.shake { animation: shake .4s; }
@keyframes shake { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translate(-50%, 20px); opacity: 0; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; z-index: 5; width: max-content; max-width: calc(100% - 32px); transition: opacity .25s, transform .25s; pointer-events: none; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* illustrations */
.spin { animation: spin 18s linear infinite; transform-origin: 50% 50%; transform-box: fill-box; }
.spin-r { animation: spin 9s linear infinite reverse; transform-origin: 50px 50px; }
@keyframes spin { to { transform: rotate(360deg); } }
.meridian { animation: meridian 6s linear infinite; transform-origin: 50px 50px; }
@keyframes meridian { 0% { transform: scaleX(1); } 50% { transform: scaleX(0.05); } 100% { transform: scaleX(1); } }
.bubble { animation: bubble 2.6s ease-in infinite; }
@keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-34px); opacity: 0; } }
.wave { stroke-dasharray: 220; animation: draw 4s ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 220; } 60%, 100% { stroke-dashoffset: 0; } }
.rung { transform-box: fill-box; transform-origin: center; animation: twist 2.4s ease-in-out infinite; }
@keyframes twist { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }

html[lang="ar"] * { letter-spacing: 0 !important; text-transform: none !important; }
html[lang="ar"] .hero h1 { line-height: 1.2; }
html[lang="ar"] .cat-card h3 { line-height: 1.25; }

@media (max-width: 1060px) { .cat-card { flex-basis: calc((100% - 32px) / 3); } }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .cat-card { flex-basis: calc((100% - 16px) / 2); min-height: 300px; } }
@media (max-width: 480px) { .cat-card { flex-basis: 100%; min-height: 0; } .hero p { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>

try { const s = JSON.parse(localStorage.getItem("gq-lang")); if (T[s]) lang = s; else if (T[(navigator.language || "").slice(0, 2)]) lang = navigator.language.slice(0, 2); } catch {}
let factIndex = Math.floor(Math.random() * T.en.facts.length), factTimer = null;

function applyLang() {
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = d[el.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  showFact(false);
}
function showFact(animate) {
  const d = T[lang], [cat, text] = d.facts[factIndex], box = document.getElementById("fact"), el = document.getElementById("factText");
  const put = () => { el.textContent = text; document.getElementById("factCat").textContent = d.cats[cat]; box.style.setProperty("--fact-c", COLORS[cat]); el.classList.remove("fade"); };
  if (animate) { el.classList.add("fade"); setTimeout(put, 350); } else put();
}
function nextFact() { factIndex = (factIndex + 1) % T.en.facts.length; showFact(true); clearInterval(factTimer); factTimer = setInterval(nextFact, 9000); }
document.getElementById("nextFact").addEventListener("click", nextFact);
factTimer = setInterval(nextFact, 9000);
document.querySelector(".lang").addEventListener("click", (e) => {
  const b = e.target.closest("[data-lang]"); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem("gq-lang", JSON.stringify(lang)); } catch {}
  applyLang();
});
let toastTimer;
document.getElementById("grid").addEventListener("click", (e) => {
  const card = e.target.closest("button.cat-card"); if (!card) return;
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  const t = document.getElementById("toast");
  t.textContent = T[lang].soonToast.replace("{name}", T[lang].cats[card.dataset.cat]);
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
});
applyLang();

const EARTH = "img/earth-mini.jpg";

// ---------- Geography card: a spinning satellite Earth ----------
(function () {
  const cv = document.getElementById("miniGlobe"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(2, window.devicePixelRatio || 1), CSS = 112, N = Math.round(CSS * dpr);
  cv.width = N; cv.height = N;
  const R = N * 0.4, cx = N / 2, cy = N / 2, D = Math.ceil(R * 2);
  const TILT = 0.38;                       // viewed a little from above, like a desk globe
  const CITIES = [[48.86, 2.35, "#ffb547"], [30.04, 31.24, "#ff5c9a"], [35.68, 139.69, "#b8f03a"], [-22.91, -43.17, "#4d8dff"], [40.71, -74.0, "#2ee6c5"], [-33.87, 151.21, "#ffb547"], [-1.29, 36.82, "#b8f03a"], [28.61, 77.21, "#ff5c9a"]];
  const img = new Image();
  img.onload = () => {
    const tc = document.createElement("canvas"); tc.width = img.width; tc.height = img.height;
    const tctx = tc.getContext("2d"); tctx.drawImage(img, 0, 0);
    const tex = tctx.getImageData(0, 0, tc.width, tc.height).data, TW = tc.width, TH = tc.height;
    // Work out once, for every pixel of the disc, which latitude it shows, its longitude offset and its lighting.
    const off = document.createElement("canvas"); off.width = D; off.height = D;
    const octx = off.getContext("2d"), out = octx.createImageData(D, D);
    const idx = [], row = [], ub = [], shade = [];
    const L = [-0.42, 0.38, 0.82], cosT = Math.cos(TILT), sinT = Math.sin(TILT);
    for (let py = 0; py < D; py++) for (let px = 0; px < D; px++) {
      const x = (px + 0.5 - R) / R, y = -(py + 0.5 - R) / R, rr = x * x + y * y;
      if (rr > 1) continue;
      const z = Math.sqrt(1 - rr), gy = y * cosT + z * sinT, gz = -y * sinT + z * cosT;
      const lat = Math.asin(Math.max(-1, Math.min(1, gy))), lon = Math.atan2(x, gz);
      const diff = Math.max(0, x * L[0] + y * L[1] + z * L[2]);
      const edge = Math.min(1, rr * rr * 0.9);
      idx.push((py * D + px) * 4);
      row.push(Math.min(TH - 1, Math.floor((0.5 - lat / Math.PI) * TH)) * TW);
      ub.push((lon + Math.PI) / (2 * Math.PI) * TW);
      shade.push((0.38 + 1.0 * diff) * (1 - edge * 0.3));
    }
    let rot = 0, last = performance.now();
    function project(lat, lon) {
      const la = lat * Math.PI / 180, lo = lon * Math.PI / 180 + rot;
      const gx = Math.cos(la) * Math.sin(lo), gy = Math.sin(la), gz = Math.cos(la) * Math.cos(lo);
      return [gx, gy * cosT - gz * sinT, gy * sinT + gz * cosT];
    }
    function orbitPoint(a) {                // a tilted ring around the globe
      const ox = Math.cos(a) * 1.2, oz = Math.sin(a) * 1.2, tilt = 0.5;
      return [ox, oz * Math.sin(tilt) * 0.55, oz * Math.cos(tilt)];
    }
    function drawOrbit(front) {
      ctx.lineWidth = 1.2 * dpr; ctx.strokeStyle = "rgba(46,230,197,0.45)"; ctx.setLineDash([3 * dpr, 4 * dpr]);
      ctx.beginPath(); let started = false;
      for (let i = 0; i <= 120; i++) {
        const p = orbitPoint(i / 120 * Math.PI * 2);
        if ((p[2] > 0) !== front) { started = false; continue; }
        const sx = cx + p[0] * R, sy = cy - p[1] * R;
        started ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); started = true;
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    function drawSat(t, front) {
      const p = orbitPoint(t * 0.0011); if ((p[2] > 0) !== front) return;
      const sx = cx + p[0] * R, sy = cy - p[1] * R;
      ctx.fillStyle = "#ffffff"; ctx.shadowColor = "#2ee6c5"; ctx.shadowBlur = 10 * dpr;
      ctx.beginPath(); ctx.arc(sx, sy, 2.6 * dpr, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
    function frame(t) {
      const dt = Math.min(64, t - last); last = t;
      if (!reduce) rot += dt * 0.00032;
      const shift = (rot / (2 * Math.PI)) * TW;
      const px = out.data;
      for (let i = 0; i < idx.length; i++) {
        let u = Math.floor(ub[i] - shift) % TW; if (u < 0) u += TW;
        const s4 = (row[i] + u) * 4, o = idx[i], k = shade[i];
        px[o] = Math.min(255, tex[s4] * k); px[o + 1] = Math.min(255, tex[s4 + 1] * k); px[o + 2] = Math.min(255, tex[s4 + 2] * k + 6); px[o + 3] = 255;
      }
      octx.putImageData(out, 0, 0);
      ctx.clearRect(0, 0, N, N);
      // atmosphere glow
      const glow = ctx.createRadialGradient(cx, cy, R * 0.92, cx, cy, R * 1.25);
      glow.addColorStop(0, "rgba(110,190,255,0.55)"); glow.addColorStop(1, "rgba(110,190,255,0)");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 1.25, 0, Math.PI * 2); ctx.fill();
      drawOrbit(false); drawSat(t, false);
      ctx.drawImage(off, cx - R, cy - R);
      // thin bright rim, like the edge of the atmosphere
      ctx.strokeStyle = "rgba(160,215,255,0.55)"; ctx.lineWidth = 1.2 * dpr; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      // city pins on the side facing us
      for (const [la, lo, c] of CITIES) {
        const [x, y, z] = project(la, lo); if (z < 0.2) continue;
        const sx = cx + x * R, sy = cy - y * R, pulse = (((t / 900 + la) % 1) + 1) % 1;
        ctx.globalAlpha = z;
        ctx.strokeStyle = c; ctx.lineWidth = 1.2 * dpr; ctx.globalAlpha = z * (1 - pulse);
        ctx.beginPath(); ctx.arc(sx, sy, (2 + pulse * 7) * dpr, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = z; ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 8 * dpr;
        ctx.beginPath(); ctx.arc(sx, sy, 2.2 * dpr, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
      drawOrbit(true); drawSat(t, true);
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };
  img.src = EARTH;
})();

// ---------- background: a drifting network of ideas ----------
(function () {
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PALETTE = Object.values(COLORS);
  const GLYPHS = ["H₂O", "π", "E=mc²", "∑", "DNA", "√2", "Fe", "λ", "∞", "Δ", "CO₂", "x²", "Au", "F=ma", "°C", "N", "O₂", "%", "÷", "Ω"];
  let W = 0, H = 0, dpr = 1, nodes = [], pulses = [], blobs = [], mouse = { x: -999, y: -999 };

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const count = Math.round(Math.min(90, Math.max(36, W * H / 17000)));
    nodes = Array.from({ length: count }, (_, i) => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
      c: PALETTE[i % PALETTE.length], r: 1.6 + Math.random() * 2.2,
      g: i % 3 === 0 ? GLYPHS[(i / 3) % GLYPHS.length | 0] : null,
      s: 12 + Math.random() * 10,
    }));
    blobs = PALETTE.map((c, i) => ({ c, a: (i / PALETTE.length) * Math.PI * 2, rad: 0.5 + Math.random() * 0.25, sp: 0.00012 + Math.random() * 0.0001 }));
  }
  window.addEventListener("resize", resize); resize();
  window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener("pointerleave", () => { mouse.x = mouse.y = -999; });

  const LINK = 150;
  function frame(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#060912"; ctx.fillRect(0, 0, W, H);
    // aurora of colour
    ctx.globalCompositeOperation = "lighter";
    for (const b of blobs) {
      const x = W / 2 + Math.cos(b.a + t * b.sp) * W * 0.42, y = H / 2 + Math.sin(b.a * 1.3 + t * b.sp * 1.4) * H * 0.38, r = Math.max(W, H) * b.rad * 0.55;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, b.c + "22"); g.addColorStop(1, b.c + "00");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = "source-over";
    // move
    for (const n of nodes) {
      if (!reduce) { n.x += n.vx; n.y += n.vy; }
      const dx = n.x - mouse.x, dy = n.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 120 * 120 && d2 > 1) { const f = (1 - Math.sqrt(d2) / 120) * 0.6; n.x += dx / Math.sqrt(d2) * f; n.y += dy / Math.sqrt(d2) * f; }
      if (n.x < -30) n.x = W + 30; if (n.x > W + 30) n.x = -30;
      if (n.y < -30) n.y = H + 30; if (n.y > H + 30) n.y = -30;
    }
    // links
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
      if (d < LINK) {
        const al = (1 - d / LINK) * 0.35;
        const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        g.addColorStop(0, a.c); g.addColorStop(1, b.c);
        ctx.globalAlpha = al; ctx.strokeStyle = g;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        if (!reduce && Math.random() < 0.0009) pulses.push({ a, b, p: 0 });
      }
    }
    ctx.globalAlpha = 1;
    // signals travelling between ideas
    pulses = pulses.filter((s) => {
      s.p += 0.018;
      const d = Math.hypot(s.a.x - s.b.x, s.a.y - s.b.y);
      if (s.p >= 1 || d > LINK) return false;
      const x = s.a.x + (s.b.x - s.a.x) * s.p, y = s.a.y + (s.b.y - s.a.y) * s.p;
      ctx.shadowColor = s.b.c; ctx.shadowBlur = 14; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      return true;
    });
    // nodes and symbols
    for (const n of nodes) {
      if (n.g) {
        ctx.font = `800 ${n.s}px "Bricolage Grotesque", system-ui, sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.shadowColor = n.c; ctx.shadowBlur = 12; ctx.fillStyle = n.c; ctx.globalAlpha = 0.85;
        ctx.fillText(n.g, n.x, n.y); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = n.c; ctx.shadowColor = n.c; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    // soft vignette so the cards stay readable
    const v = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(6,9,18,0)"); v.addColorStop(1, "rgba(6,9,18,0.75)");
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
